<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    *{
box-sizing: border-box;
font-family: Arial;

    }

    .card1{
        width: 400px;
        padding: 20px;
        border: 2px solid black;
        margin: 20px auto;
        border-radius: 5px 5px 20px rgba(0,0,0,0.2);
    }
    .card2{
        padding: 15px;
        border: 2px solid gray;
        margin-top:  15px;
        border-radius: 8px;
    }
    .card3{
     padding: 10px;
     border: 2px dashed blue;
     margin-top: 10px;
     border-radius: 6px;
    }
    .button{
        margin-top: 15px;
        padding: 10px 20px;
        border: none;
        border-radius: 15px;
        background: #e0e0e0;
        box-shadow: 5px 5px 10px #bebebe,
        -5px -5px 10px #ffffff;
    }
    .button:active{
        box-shadow: inset 5px 5px 10px #bebebe, 
        inset -5px -5px 10px #ffffff;
    }

</style>
<body>
    <h1>Card task</h1>
    <div class="card1">Card 1</div>
     <div class="card2">Card 2</div>
      <div class="card3">Card 3</div>
      <button class="button">click</button>
</body>
</html>
